name: Public Sanitization

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject private or connected-site material
        run: python tools/check_public_sanitization.py
