name: Signalproof Community CLI

on:
  push:
    paths:
      - 'community-cli/**'
      - '.github/workflows/community-cli.yml'
  pull_request:
    paths:
      - 'community-cli/**'
      - '.github/workflows/community-cli.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Community CLI tests
        run: python -m unittest community-cli/test_community_cli.py -v
